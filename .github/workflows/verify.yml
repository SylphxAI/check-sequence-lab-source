name: Source verification
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" != workflow-negative
